name: GoogleTVRemote

options:
  bundleIdPrefix: com.franktriolo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: BJB8XCZ8X9
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES

packages:
  TVRemoteKit:
    path: Packages/TVRemoteKit

targets:
  GoogleTVRemote:
    type: application
    platform: macOS
    sources:
      - path: GoogleTVRemote
      - path: SharedAssets.xcassets
    dependencies:
      - package: TVRemoteKit
      - target: TVRemoteWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.franktriolo.googletvremote
        PRODUCT_NAME: MacDroid TV
        INFOPLIST_FILE: GoogleTVRemote/Info.plist
        CODE_SIGN_ENTITLEMENTS: GoogleTVRemote/GoogleTVRemote.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  TVRemoteWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: TVRemoteWidget
      - path: SharedAssets.xcassets
    dependencies:
      - package: TVRemoteKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.franktriolo.googletvremote.widget
        PRODUCT_NAME: TVRemoteWidgetExtension
        INFOPLIST_FILE: TVRemoteWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: TVRemoteWidget/TVRemoteWidget.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../../../../Frameworks"

  TVRemoteKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Packages/TVRemoteKit/Tests/TVRemoteKitTests
    dependencies:
      - package: TVRemoteKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.franktriolo.googletvremote.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GoogleTVRemote:
    build:
      targets:
        GoogleTVRemote: all
        TVRemoteWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TVRemoteKitTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
